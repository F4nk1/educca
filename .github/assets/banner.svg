<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="EDUCCA Cusco — EcoCapacita">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B241C"/>
      <stop offset="52%" stop-color="#154D3D"/>
      <stop offset="100%" stop-color="#0D7A6E"/>
    </linearGradient>
    <linearGradient id="mountainBack" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E6B56" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#0A2019" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="mountainFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F3B2E" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#081A14" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6EE7B7"/>
      <stop offset="60%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#C66C3F"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="85%" cy="22%" r="36%">
      <stop offset="0%" stop-color="#FDE68A" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#C66C3F" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#C66C3F" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="roundedClip">
      <rect width="1200" height="300" rx="20"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundedClip)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bgGrad)"/>
    <rect width="1200" height="300" fill="url(#sunGlow)"/>

    <!-- Subtle top-right geometric grid dots -->
    <g fill="#A7F3D0" opacity="0.14">
      <circle cx="940" cy="44" r="2.2"/><circle cx="964" cy="44" r="2.2"/><circle cx="988" cy="44" r="2.2"/><circle cx="1012" cy="44" r="2.2"/><circle cx="1036" cy="44" r="2.2"/><circle cx="1060" cy="44" r="2.2"/><circle cx="1084" cy="44" r="2.2"/><circle cx="1108" cy="44" r="2.2"/><circle cx="1132" cy="44" r="2.2"/>
      <circle cx="940" cy="68" r="2.2"/><circle cx="964" cy="68" r="2.2"/><circle cx="988" cy="68" r="2.2"/><circle cx="1012" cy="68" r="2.2"/><circle cx="1036" cy="68" r="2.2"/><circle cx="1060" cy="68" r="2.2"/><circle cx="1084" cy="68" r="2.2"/><circle cx="1108" cy="68" r="2.2"/><circle cx="1132" cy="68" r="2.2"/>
      <circle cx="940" cy="92" r="2.2"/><circle cx="964" cy="92" r="2.2"/><circle cx="988" cy="92" r="2.2"/><circle cx="1012" cy="92" r="2.2"/><circle cx="1036" cy="92" r="2.2"/><circle cx="1060" cy="92" r="2.2"/><circle cx="1084" cy="92" r="2.2"/><circle cx="1108" cy="92" r="2.2"/><circle cx="1132" cy="92" r="2.2"/>
    </g>

    <!-- Andean mountains silhouette -->
    <path d="M0 248 L145 190 L265 224 L420 165 L560 218 L735 152 L880 198 L1045 130 L1200 185 L1200 300 L0 300 Z" fill="url(#mountainBack)"/>
    <path d="M0 272 C170 232 310 245 450 264 C610 284 740 228 910 212 C1030 200 1125 222 1200 242 L1200 300 L0 300 Z" fill="url(#mountainFront)"/>

    <!-- Accent top stripe -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accentGlow)"/>

    <!-- Emblem icon container -->
    <g transform="translate(64, 62)">
      <rect width="74" height="74" rx="18" fill="#FFFFFF" fill-opacity="0.1" stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="1.5"/>
      <path d="M37 16 C25 26 20 37 20 47 C20 55.8 27.6 62 37 62 C46.4 62 54 55.8 54 47 C54 37 49 26 37 16 Z" fill="#ECFDF5"/>
      <path d="M37 28 V56" stroke="#154D3D" stroke-width="3" stroke-linecap="round"/>
      <path d="M37 39 L28 34" stroke="#154D3D" stroke-width="2.4" stroke-linecap="round"/>
      <path d="M37 46 L46 41" stroke="#154D3D" stroke-width="2.4" stroke-linecap="round"/>
    </g>

    <!-- Institutional eyebrow pill -->
    <g transform="translate(160, 62)">
      <rect width="388" height="26" rx="13" fill="#6EE7B7" fill-opacity="0.15" stroke="#6EE7B7" stroke-opacity="0.35" stroke-width="1"/>
      <text x="16" y="17" fill="#A7F3D0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11.5" font-weight="700" letter-spacing="1.4">
        MUNICIPALIDAD PROVINCIAL DEL CUSCO · EDUCCA
      </text>
    </g>

    <!-- Main Title -->
    <text x="160" y="136" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.8">
      EDUCCA · EcoCapacita
    </text>

    <!-- Subtitle -->
    <text x="160" y="170" fill="#D1FAE5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">
      Plataforma integral de capacitaciones ambientales, control de asistencia QR + GPS (80 m) y cumplimiento LPDP
    </text>

    <!-- Tech & capability tags -->
    <g transform="translate(160, 202)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
      <rect x="0" y="0" width="122" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="61" y="19.5" text-anchor="middle" fill="#ECFDF5">API REST · Go</text>

      <rect x="134" y="0" width="136" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="202" y="19.5" text-anchor="middle" fill="#ECFDF5">Web · React + TS</text>

      <rect x="282" y="0" width="132" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="348" y="19.5" text-anchor="middle" fill="#ECFDF5">Móvil · Flutter</text>

      <rect x="426" y="0" width="150" height="30" rx="8" fill="#FFFFFF" fill-opacity="0.1" stroke="#FFFFFF" stroke-opacity="0.18"/>
      <text x="501" y="19.5" text-anchor="middle" fill="#ECFDF5">PostgreSQL 18</text>

      <rect x="588" y="0" width="194" height="30" rx="8" fill="#C66C3F" fill-opacity="0.32" stroke="#FDBA74" stroke-opacity="0.45"/>
      <text x="685" y="19.5" text-anchor="middle" fill="#FEF3C7">educca.cocorium.online</text>
    </g>

    <!-- Subtle inner border -->
    <rect x="0.75" y="0.75" width="1198.5" height="298.5" rx="19.25" fill="none" stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="1.5"/>
  </g>
</svg>
